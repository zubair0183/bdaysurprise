        .floating-item {
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            will-change: transform, opacity;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 225, 0.22);

            -webkit-backdrop-filter: blur(10px);

            transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;

            .floating-item:hover {
                background: rgba(255, 255, 255, 0.12);
                border-color: rgba(255, 230, 240, 0.6);
                box-shadow:

                    inset 0 1px 6px rgba(255, 255, 255, 0.4);

        /* Wrong guess animation */
        .wrong-shake {
            animation: wrongJitter 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes wrongJitter {
            10%, 90% { transform: translate3d(-3px, 0, 0) scale(0.96); opacity: 0.55; }
            20%, 80% { transform: translate3d(4px, 0, 0) scale(0.96); opacity: 0.55; }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0) scale(0.98); opacity: 0.7; }
            40%, 60% { transform: translate3d(3px, 0, 0) scale(0.98); opacity: 0.7; }
            100% { opacity: 1; }

        /* Success Shockwave Rings */
        .shockwave-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(253, 224, 139, 0.9);
            box-shadow: 0 0 25px rgba(247, 170, 183, 0.8), inset 0 0 15px rgba(253, 224, 139, 0.6);
            pointer-events: none;
            opacity: 0;
            will-change: transform, opacity;
        }

        .ring-burst {

        @keyframes ringExpand {

            80% {

            100% {

            animation: rumble 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;

    <script>
        class SoundFXSynthesizer {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContextClass();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSoftTick() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);

                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.08);
                } catch(e) {}
            }

            playChimeSuccess() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    // Arpeggiated celestial bell chord (D5, F#5, A5, D6)
                    const notes = [587.33, 739.99, 880.00, 1174.66];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.07);

                        const startT = now + idx * 0.07;
                        gain.gain.setValueAtTime(0.001, startT);
                        gain.gain.linearRampToValueAtTime(0.28, startT + 0.03);
                        gain.gain.exponentialRampToValueAtTime(0.0001, startT + 1.2);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.start(startT);
                        osc.stop(startT + 1.2);
                    });
                } catch(e) {}
            }

            playImpactBoom() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const duration = 1.3;

                    // 1. Deep sub-frequency rumble
                    const subOsc = this.ctx.createOscillator();
                    const subGain = this.ctx.createGain();

                    subOsc.type = 'sine';
                    subOsc.frequency.setValueAtTime(130, now);
                    subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.6);

                    subGain.gain.setValueAtTime(0.85, now);
                    subGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                    subOsc.connect(subGain);
                    subGain.connect(this.ctx.destination);

                    subOsc.start(now);
                    subOsc.stop(now + duration);

                    // 2. High impact burst noise
                    const bufferSize = this.ctx.sampleRate * 0.45;
                    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
                    }

                    const noiseSource = this.ctx.createBufferSource();
                    noiseSource.buffer = noiseBuffer;

                    const noiseFilter = this.ctx.createBiquadFilter();
                    noiseFilter.type = 'lowpass';
                    noiseFilter.frequency.setValueAtTime(1800, now);
                    noiseFilter.frequency.exponentialRampToValueAtTime(120, now + 0.45);

                    const noiseGain = this.ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.65, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                    noiseSource.connect(noiseFilter);
                    noiseFilter.connect(noiseGain);
                    noiseGain.connect(this.ctx.destination);

                    noiseSource.start(now);
                    noiseSource.stop(now + 0.45);
                } catch(e) {}
            }
        }

        const sound = new SoundFXSynthesizer();
    </script>

    <script>
        // High Performance 2D Canvas Particle Engine for the Grand Explosion
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        let particles = [];
        let isExploding = false;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class SparkParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 16 + 4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.friction = 0.955;
                this.size = Math.random() * 4.5 + 2;
                this.alpha = 1;
                this.decay = Math.random() * 0.018 + 0.012;
                // Palette: Sparkling champagne gold, bright white, hot rose
                const colors = ['#ffffff', '#fff2c2', '#fde08b', '#ff94b1', '#ff5c8a'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }
        }

        function triggerGrandExplosion(originX, originY) {
            isExploding = true;
            particles = [];
            // Produce 260 rich glowing particles
            for (let i = 0; i < 260; i++) {
                particles.push(new SparkParticle(originX, originY));
            }

            function runParticleLoop() {
                ctx.clearRect(0, 0, width, height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                particles = particles.filter(p => p.alpha > 0);

                if (particles.length > 0) {
                    requestAnimationFrame(runParticleLoop);
                }
            }
            requestAnimationFrame(runParticleLoop);
        }
    </script>

        // Object instance representation with jitter-free vectorized math
        class FloatingEntity {
            constructor(config, bounds) {
                this.config = config;
                this.size = config.size;
                this.bounds = bounds;

                // Random non-overlapping distribution initial coordinates
                this.x = Math.random() * (bounds.width - this.size);
                this.y = Math.random() * (bounds.height - this.size);

                // Movement physics parameters (unique per item: some spin, some drift horizontal)
                this.vx = (Math.random() * 0.8 + 0.3) * (Math.random() > 0.5 ? 1 : -1);
                this.vy = (Math.random() * 0.7 + 0.25) * (Math.random() > 0.5 ? 1 : -1);
                
                // Rotational physics
                this.rotation = Math.random() * 360;
                this.vRot = (Math.random() * 0.45 + 0.15) * (Math.random() > 0.5 ? 1 : -1);

                // Wave bobbing parameters
                this.wavePhase = Math.random() * Math.PI * 2;
                this.waveSpeed = Math.random() * 0.02 + 0.015;
                this.waveAmplitude = Math.random() * 0.8 + 0.4;

                this.isFrozen = false;
                this.element = this.createElement();
            }

            createElement() {
                const el = document.createElement('div');
                el.className = 'floating-item';
                el.style.width = `${this.size}px`;
                el.style.height = `${this.size}px`;
                el.setAttribute('aria-label', this.config.title);
                el.innerHTML = this.config.svg;

                // Bind touch & click interactions
                el.addEventListener('click', (e) => this.handleClick(e));
                el.addEventListener('touchstart', (e) => {
                    sound.init(); // Pre-warm audio context
                }, { passive: true });

                playfield.appendChild(el);
                return el;
            }

            update(bounds) {
                if (this.isFrozen) return;

                this.bounds = bounds;
                this.wavePhase += this.waveSpeed;

                // Apply velocity + undulating wave
                this.x += this.vx;
                this.y += this.vy + Math.sin(this.wavePhase) * this.waveAmplitude;
                this.rotation += this.vRot;

                // Bounce off soft playfield boundaries
                if (this.x <= 4) {
                    this.x = 4;
                    this.vx = Math.abs(this.vx);
                } else if (this.x >= bounds.width - this.size - 4) {
                    this.x = bounds.width - this.size - 4;
                    this.vx = -Math.abs(this.vx);
                }

                if (this.y <= 4) {
                    this.y = 4;
                    this.vy = Math.abs(this.vy);
                } else if (this.y >= bounds.height - this.size - 4) {
                    this.y = bounds.height - this.size - 4;
                    this.vy = -Math.abs(this.vy);
                }

                // Render with GPU transform3d (Lag-free, no reflow)
                this.element.style.transform = `translate3d(${this.x}px, ${this.y}px, 0px) rotate(${this.rotation}deg)`;
            }

                sound.init();

                if (this.config.isKey) {
                    handleKeyFound(this);
                } else {
                    handleWrongItem(this);
                }
            }
        }

        // High-fps Physics RAF Loop
        function animatePhysics() {
            if (!gameResolved) {
                const rect = playfield.getBoundingClientRect();
                for (let i = 0; i < entities.length; i++) {
                    entities[i].update(rect);
                }
            }
            requestAnimationFrame(animatePhysics);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initFloatingItems();
            animatePhysics();
        });

        // Window resize responsive positioning adjustment
        window.addEventListener('resize', () => {
            const rect = playfield.getBoundingClientRect();
            entities.forEach(item => {
                if (item.x > rect.width - item.size) item.x = rect.width - item.size - 10;
                if (item.y > rect.height - item.size) item.y = rect.height - item.size - 10;
            });
        });
    </script>

    <script>
        function handleWrongItem(entity) {
            sound.playSoftTick();
            entity.element.classList.remove('wrong-shake');
            // Trigger reflow to restart shake animation reliably
            void entity.element.offsetWidth;
            entity.element.classList.add('wrong-shake');
            showDecoyHint();
        }

        function handleKeyFound(keyEntity) {
            gameResolved = true;

            // 1. Freeze key and all other decoys
            entities.forEach(e => {
                e.isFrozen = true;
                if (e !== keyEntity) {
                    // Decoys gently dissolve away
                    e.element.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                    e.element.style.opacity = '0';
                    e.element.style.transform += ' scale(0.6)';
                }
            });

            // 2. Key intensifies glow
            keyEntity.element.style.transition = 'all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
            keyEntity.element.style.background = 'rgba(253, 224, 139, 0.28)';
            keyEntity.element.style.borderColor = 'rgba(255, 255, 255, 0.95)';
            keyEntity.element.style.boxShadow = '0 0 50px 15px rgba(253, 224, 139, 0.85), inset 0 0 20px #fff';
            keyEntity.element.style.transform = `translate3d(${keyEntity.x}px, ${keyEntity.y}px, 0px) scale(1.3) rotate(${keyEntity.rotation}deg)`;

            // 3. Expanding Ring Shockwave
            const ring = document.createElement('div');
            ring.className = 'shockwave-ring ring-burst';
            ring.style.width = `${keyEntity.size}px`;
            ring.style.height = `${keyEntity.size}px`;
            ring.style.left = `${keyEntity.x}px`;
            ring.style.top = `${keyEntity.y}px`;
            playfield.appendChild(ring);

            // 4. Play harmonic celestial chime
            sound.playChimeSuccess();

            // 5. Hide Game UI cleanly
            headerBlock.style.opacity = '0';
            hintToast.style.opacity = '0';

            // Get Key Center coordinates for the upcoming particle explosion
            const keyRect = keyEntity.element.getBoundingClientRect();
            const centerX = keyRect.left + keyRect.width / 2;
            const centerY = keyRect.top + keyRect.height / 2;

            // 6. After the ring and chime flourish, entire screen becomes COMPLETELY STILL for ~280ms
            setTimeout(() => {
                // Key vanishes as stillness descends
                keyEntity.element.style.opacity = '0';
                ring.remove();

                // Intentional quiet suspension pause (280ms)
                setTimeout(() => {
                    executeGrandImpact(centerX, centerY);
                }, 280);

            }, 550);
        }

        function executeGrandImpact(originX, originY) {
            // FLASH -> IMPACT -> BOOM

            // 1. Play boom sound at exact impact moment
            sound.playImpactBoom();

            // 2. Screen shakes
            document.body.classList.add('screen-rumble');

            // 3. Bright pink/white flash (roughly 120ms)
            flashOverlay.classList.add('flash-active');

            // 4. Hundreds of glowing particles burst outward
            triggerGrandExplosion(originX, originY);

            // 5. Fade out page 3 stage behind the blast
            gameStage.style.transition = 'opacity 0.2s ease';
            gameStage.style.opacity = '0';

            // 6. Seamless redirect to Page 4 as the blast clears
            setTimeout(() => {
                window.location.href = "page4.html";
            }, 950);
        }
    </script>
</body>
</html>

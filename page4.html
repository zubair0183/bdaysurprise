
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Shree | Page 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,600&family=Montserrat:wght@200;300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-rose-dusk: #250918;
            --bg-purple-deep: #3b112d;
            --bg-rich-berry: #55173e;
            --bg-warm-violet: #6b1f4c;
            --accent-gold: #fde293;
            --accent-candle: #ffbe5b;
            --text-champagne: #fff1f3;
            --text-rose: #f3b6c2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-rose-dusk);
            color: var(--text-champagne);
        }

        .serif-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        .script-font {
            font-family: 'Pinyon Script', cursive, serif;
        }

        /* Rich Twilight Pink -> Purple -> Deep Rose living gradient */
        .ambient-rich-mesh {
            background: radial-gradient(circle at 50% 38%, #5a1940 0%, #3d122d 42%, #260a1c 78%, #160410 100%);
            background-size: 130% 130%;
            transition: filter 1.1s cubic-bezier(0.2, 0.8, 0.25, 1), background-color 1.1s ease;
        }

        /* Central soft radial aura behind cake */
        .ambient-bloom {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vw;
            max-width: 580px;
            max-height: 580px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(247, 148, 175, 0.18) 0%, rgba(132, 45, 87, 0.1) 48%, transparent 72%);
            filter: blur(55px);
            pointer-events: none;
            animation: breatheAura 7s ease-in-out infinite alternate;
            transition: opacity 1.1s ease;
        }

        @keyframes breatheAura {
            0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.65; }
            100% { transform: translate(-50%, -50%) scale(1.08); opacity: 0.95; }
        }

        /* Illustrated Cake Rising Entrance */
        .cake-assembly {
            opacity: 0;
            transform: translateY(48px) scale(0.94);
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), filter 1s ease;
            will-change: transform, opacity;
        }

        .cake-assembly.arrived {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Candle Flames Animation */
        .candle-flame {
            transform-origin: 50% 90%;
            opacity: 0;
            transform: scale(0);
            transition: transform 0.45s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.3s ease;
            filter: drop-shadow(0 0 6px rgba(255, 190, 91, 0.9)) drop-shadow(0 0 16px rgba(255, 120, 150, 0.7));
        }

        .candle-flame.ignited {
            opacity: 1;
            transform: scale(1);
            animation: flameFlicker 1.8s ease-in-out infinite alternate;
        }

        .flame-left.ignited {
            animation-duration: 1.6s;
            animation-delay: -0.4s;
        }

        .flame-center.ignited {
            animation-duration: 2.1s;
            animation-delay: -0.9s;
        }

        .flame-right.ignited {
            animation-duration: 1.75s;
            animation-delay: -0.2s;
        }

        @keyframes flameFlicker {
            0% { transform: scale(1) rotate(-1.5deg) skewX(-1deg); }
            30% { transform: scale(1.05, 0.96) rotate(1.2deg) skewX(1deg); }
            60% { transform: scale(0.96, 1.04) rotate(-2deg) skewX(-1.5deg); }
            100% { transform: scale(1.03, 1.02) rotate(1.8deg) skewX(1deg); }
        }

        /* Floating sparks around the cake */
        .floating-glow-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255, 235, 200, 0.95) 0%, rgba(255, 160, 185, 0.4) 60%, transparent 100%);
            animation: orbFloat 4.5s ease-in-out infinite alternate;
        }

        @keyframes orbFloat {
            0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
            50% { transform: translateY(-12px) translateX(6px); opacity: 0.8; }
            100% { transform: translateY(-24px) translateX(-5px); opacity: 0.2; }
        }

        /* Main Birthday Typography Choreography */
        .birthday-text-block {
            opacity: 0;
            transform: translateY(18px);
            transition: opacity 1.1s cubic-bezier(0.2, 0.8, 0.25, 1), transform 1.1s cubic-bezier(0.2, 0.8, 0.25, 1), filter 1s ease;
            will-change: opacity, transform;
        }

        .birthday-text-block.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        /* Illustrated Sealed Luxury Envelope */
        #envelope-wrapper {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        box-shadow 0.4s ease, 
                        border-color 0.4s ease;
            will-change: transform, opacity, left, top;
        }

        #envelope-wrapper.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        /* Very gentle vertical bobbing */
        .envelope-idle-bob {
            animation: envelopeFloat 3.8s ease-in-out infinite;
        }

        @keyframes envelopeFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .envelope-card {
            background: linear-gradient(135deg, #f7e6e8 0%, #ecd0d6 50%, #e2bcc4 100%);
            border: 1px solid rgba(255, 235, 240, 0.65);
            box-shadow: 
                0 12px 32px rgba(22, 4, 15, 0.45),
                0 2px 6px rgba(255, 255, 255, 0.7) inset,
                0 -2px 6px rgba(125, 45, 68, 0.15) inset;
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
                        box-shadow 0.35s ease,
                        filter 0.35s ease;
            cursor: pointer;
        }

        @media (hover: hover) and (pointer: fine) {
            .envelope-card:hover {
                transform: scale(1.035) translateY(-3px);
                box-shadow: 
                    0 18px 42px rgba(35, 6, 25, 0.6),
                    0 0 22px rgba(253, 226, 230, 0.5),
                    0 2px 8px rgba(255, 255, 255, 0.9) inset;
                filter: brightness(1.04);
            }
        }

        .envelope-card:active {
            transform: scale(0.98);
        }

        /* Wax Seal Stamp */
        .wax-seal {
            background: radial-gradient(circle at 35% 35%, #bf3358 0%, #8c1e39 60%, #5d0f23 100%);
            box-shadow: 
                0 4px 10px rgba(45, 5, 18, 0.5),
                0 1px 3px rgba(255, 175, 195, 0.6) inset;
        }

        /* Background scene states when envelope is clicked */
        .scene-background-focused {
            filter: blur(14px) brightness(0.28) saturate(0.8) !important;
            transform: scale(0.96);
            transition: filter 1s cubic-bezier(0.2, 0.9, 0.3, 1), transform 1s cubic-bezier(0.2, 0.9, 0.3, 1) !important;
        }

        /* Central focused envelope flight */
        .envelope-centered-zoom {
            position: fixed !important;
            z-index: 100 !important;
            left: 50% !important;
            top: 46% !important;
            margin: 0 !important;
            animation: none !important;
            transform: translate(-50%, -50%) scale(1.85) !important;
            box-shadow: 
                0 28px 70px rgba(10, 1, 8, 0.8),
                0 0 45px rgba(247, 180, 195, 0.4),
                0 3px 10px rgba(255, 255, 255, 0.9) inset !important;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), 
                        left 1s cubic-bezier(0.16, 1, 0.3, 1), 
                        top 1s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 1s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }

        @media (max-width: 640px) {
            .envelope-centered-zoom {
                transform: translate(-50%, -50%) scale(1.6) !important;
            }
        }

        /* Open Button */
        #open-letter-btn {
            opacity: 0;
            transform: translateY(14px);
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.25, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.25, 1);
            background: rgba(255, 245, 248, 0.12);
            border: 1px solid rgba(255, 220, 230, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff2f5;
            box-shadow: 0 10px 30px rgba(15, 2, 10, 0.6), 0 0 15px rgba(255, 180, 200, 0.2) inset;
        }

        #open-letter-btn.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        #open-letter-btn:hover {
            background: rgba(255, 245, 248, 0.22);
            border-color: rgba(255, 240, 245, 0.8);
            box-shadow: 0 14px 38px rgba(20, 3, 15, 0.7), 0 0 25px rgba(255, 200, 220, 0.4) inset;
            transform: translateY(-2px);
        }

        #open-letter-btn:active {
            transform: scale(0.94);
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden ambient-rich-mesh flex flex-col items-center justify-between">

    <!-- Settling sparks canvas (continues seamlessly from Page 3 blast) -->
    <canvas id="spark-canvas" class="absolute inset-0 z-0 pointer-events-none"></canvas>

    <!-- Ambient Center Halo Behind Cake -->
    <div id="ambient-bloom" class="ambient-bloom"></div>

    <!-- MAIN SCENE CONTAINER (Will blur & dim smoothly when letter is clicked) -->
    <div id="stage-container" class="relative z-10 w-full h-full flex flex-col justify-between items-center py-6 sm:py-8 px-4 transition-all duration-700">
        
        <!-- HEADER: BIRTHDAY TYPOGRAPHY -->
        <header id="birthday-header" class="birthday-text-block text-center flex flex-col items-center mt-2 sm:mt-4 z-20">
            <span class="text-xs sm:text-sm tracking-[0.38em] uppercase text-[#e9a6b5] font-light drop-shadow-sm">
                Happy Birthday
            </span>
            <h1 class="serif-title text-4xl sm:text-6xl md:text-7xl font-normal text-[#fff2f4] tracking-wide mt-1 italic drop-shadow-[0_2px_15px_rgba(255,180,200,0.35)]">
                Shree
            </h1>
        </header>

        <!-- CENTER STAGE: ILLUSTRATED CAKE & COMPANION ENVELOPE -->
        <main class="relative w-full max-w-2xl flex-1 flex flex-col md:flex-row items-center justify-center gap-6 sm:gap-10 my-auto">
            
            <!-- Illustrated Multi-Tier Cake Assembly -->
            <div id="cake-node" class="cake-assembly relative flex flex-col items-center select-none">
                
                <!-- Floating local ember orbs -->
                <div class="floating-glow-orb w-2.5 h-2.5 -top-4 -left-6" style="animation-delay: 0s;"></div>
                <div class="floating-glow-orb w-2 h-2 top-10 -right-8" style="animation-delay: 1.4s;"></div>
                <div class="floating-glow-orb w-3 h-3 bottom-6 -left-8" style="animation-delay: 2.2s;"></div>

                <!-- Custom Vector Cake SVG with Rich Material Layers -->
                <svg viewBox="0 0 340 310" class="w-64 sm:w-80 md:w-88 h-auto drop-shadow-[0_18px_35px_rgba(20,2,14,0.65)]" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Plate Gradients -->
                        <linearGradient id="plateGrad" x1="20" y1="285" x2="320" y2="285" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#4a182f" />

                    <!-- Pedestal Rim -->

                    <!-- Decorative Golden Beaded Pearls Along Base -->

            </div>

            <!-- The Companion Sealed Letter ("For you.") -->
            <div id="envelope-wrapper" class="relative z-30 select-none md:mt-12">
                <div id="envelope-bob-container" class="envelope-idle-bob">
                    <div 
                        id="envelope-interactive"

                        <div class="absolute inset-0 pointer-events-none opacity-25 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:12px_12px]"></div>

                        <!-- Top Flap Fold Crease Geometry -->

                            <polyline points="0,130 85,62" stroke="rgba(195, 120, 140, 0.25)" stroke-width="1.2" />

    <script>
        class Page4AudioDirector {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContextClass();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Soft pop and high-frequency sparkle as each candle ignites
            playIgniteChime(pitchModifier = 1) {
                try {
                    this.init();
                    const now = this.ctx.currentTime;

                    // 1. Soft breath spark
                    const bufferSize = this.ctx.sampleRate * 0.08;
                    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
                    }
                    const noiseSource = this.ctx.createBufferSource();
                    noiseSource.buffer = noiseBuffer;

                    const noiseFilter = this.ctx.createBiquadFilter();
                    noiseFilter.type = 'highpass';
                    noiseFilter.frequency.setValueAtTime(2400, now);

                    const noiseGain = this.ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.08, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                    noiseSource.connect(noiseFilter);
                    noiseFilter.connect(noiseGain);
                    noiseGain.connect(this.ctx.destination);
                    noiseSource.start(now);

                    // 2. Bell harmonic tone (G5, B5, D6)
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';

                    const baseFreq = 783.99 * pitchModifier; // G5 root
                    osc.frequency.setValueAtTime(baseFreq, now);

                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(0.18, now + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.7);
                } catch (e) {}
            }

            // Cinematic warm glide whoosh when zooming toward the letter
            playFocusZoomSound() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const duration = 1.1;

                    // Sweeping low-pass filtered air texture
                    const bufferSize = this.ctx.sampleRate * duration;
                    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    let b0 = 0, b1 = 0;
                    for (let i = 0; i < bufferSize; i++) {
                        const white = Math.random() * 2 - 1;
                        b0 = 0.99 * b0 + white * 0.08;
                        b1 = 0.97 * b1 + white * 0.12;
                        output[i] = (b0 + b1) * 0.4;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = noiseBuffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.Q.value = 1.8;
                    filter.frequency.setValueAtTime(160, now);
                    filter.frequency.exponentialRampToValueAtTime(850, now + 0.5);
                    filter.frequency.exponentialRampToValueAtTime(220, now + duration);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(0.24, now + 0.35);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    noise.start(now);
                    noise.stop(now + duration);
                } catch (e) {}
            }
        }

        const soundDirector = new Page4AudioDirector();
    </script>

    <script>
        // Settling particles continuing from the previous explosion
        const canvas = document.getElementById('spark-canvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        let settlingSparks = [];

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class SettlingSpark {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height * 0.75 : -10;
                this.size = Math.random() * 2.2 + 0.8;
                // Particles drift downward slowly with gentle horizontal flutter
                this.vy = Math.random() * 0.45 + 0.25;
                this.vx = (Math.random() - 0.5) * 0.35;
                this.alpha = Math.random() * 0.55 + 0.2;
                this.decay = Math.random() * 0.002 + 0.001;
                this.sway = Math.random() * Math.PI * 2;
                this.swaySpeed = Math.random() * 0.02 + 0.01;
                const colors = ['#fff6d6', '#fde08b', '#f9b5c4', '#ffffff', '#e89db1'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.sway += this.swaySpeed;
                this.x += this.vx + Math.sin(this.sway) * 0.4;
                this.y += this.vy;
                this.alpha -= this.decay;

                if (this.y > height + 10 || this.alpha <= 0) {
                    this.reset(false);
                }
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.restore();
            }
        }

        // Initialize 45 settling embers
        function initEmbers() {
            settlingSparks = [];
            for (let i = 0; i < 45; i++) {
                settlingSparks.push(new SettlingSpark());
            }
        }

        function loopEmbers() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < settlingSparks.length; i++) {
                settlingSparks[i].update();
                settlingSparks[i].draw();
            }
            requestAnimationFrame(loopEmbers);
        }

        initEmbers();
        loopEmbers();
    </script>

    <script>
        const cakeNode = document.getElementById('cake-node');
        const flame1 = document.getElementById('flame-1');
        const flame2 = document.getElementById('flame-2');
        const flame3 = document.getElementById('flame-3');
        const birthdayHeader = document.getElementById('birthday-header');
        const envelopeWrapper = document.getElementById('envelope-wrapper');
        const envelopeBobContainer = document.getElementById('envelope-bob-container');
        const envelopeInteractive = document.getElementById('envelope-interactive');
        const stageContainer = document.getElementById('stage-container');
        const ambientBloom = document.getElementById('ambient-bloom');
        const openLetterBtn = document.getElementById('open-letter-btn');

        // Choreography Timeline
        window.addEventListener('DOMContentLoaded', () => {
            // Pre-warm audio on early gestures
            window.addEventListener('click', () => soundDirector.init(), { once: true });
            window.addEventListener('touchstart', () => soundDirector.init(), { once: true });

            // 1. Illustrated Cake rises gracefully from below
            setTimeout(() => {
                cakeNode.classList.add('arrived');
            }, 300);

            // 2. Once cake settles (~1100ms), candles light up ONE BY ONE
            setTimeout(() => {
                flame1.classList.add('ignited');
                soundDirector.playIgniteChime(0.95);
            }, 1250);

            setTimeout(() => {
                flame2.classList.add('ignited');
                soundDirector.playIgniteChime(1.15);
            }, 1600);

            setTimeout(() => {
                flame3.classList.add('ignited');
                soundDirector.playIgniteChime(1.35);
            }, 1950);

            // 3. Main Birthday Text ("HAPPY BIRTHDAY SHREE") fades up smoothly
            setTimeout(() => {
                birthdayHeader.classList.add('revealed');
            }, 2350);

            // 4. Around 1 second after text settles, the sealed envelope appears beside the cake
            setTimeout(() => {
                envelopeWrapper.classList.add('revealed');
            }, 3350);
        });

        // ================= ENVELOPE INTERACTION & CAMERA FOCUS =================
        let isFocusedOnLetter = false;

        function handleEnvelopeFocus() {
            if (isFocusedOnLetter) return;
            isFocusedOnLetter = true;

            soundDirector.init();
            soundDirector.playFocusZoomSound();

            // 1. Stop gentle idle float so coordinate transforms are stable
            envelopeBobContainer.classList.remove('envelope-idle-bob');

            // 2. Darken background and blur cake + title
            cakeNode.style.filter = 'blur(10px) brightness(0.4)';
            cakeNode.style.opacity = '0.35';
            cakeNode.style.transform = 'scale(0.92)';

            birthdayHeader.style.filter = 'blur(6px) brightness(0.5)';
            birthdayHeader.style.opacity = '0.25';
            birthdayHeader.style.transform = 'translateY(-10px) scale(0.96)';

            ambientBloom.style.opacity = '0.15';
            document.body.style.backgroundColor = '#12030d';

            // 3. Glide Envelope to exact center of the screen & scale up (100% -> 180%)
            // Simulates camera dollying smoothly right up to the letter
            envelopeWrapper.classList.add('envelope-centered-zoom');

            // 4. Once envelope arrives at center, reveal the "OPEN" button
            setTimeout(() => {
                openLetterBtn.classList.add('show');
            }, 950);
        }

        envelopeInteractive.addEventListener('click', handleEnvelopeFocus);
        envelopeInteractive.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                handleEnvelopeFocus();
            }
        });

        openLetterBtn.addEventListener('click', () => {
            soundDirector.playIgniteChime(1.4);
            // Pre-configured hook for Page 5 (letter unwrapping / message reading)
            openLetterBtn.style.transform = 'scale(0.92)';
            setTimeout(() => {
                // If page5.html exists or is created next:
                window.location.href = "page5.html";
            }, 450);
        });
    </script>
